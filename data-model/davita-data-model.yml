service_endpoints:
  - name: find-a-center
    path: /davita/v1/find-a-center
    parameters: [location, lat, lng, modalities]
    description: >-
      Dialysis center locator. Returns {"success":true,"data":{"locations":...}}. `location` is
      required — supplying only lat/lng returns rest_missing_callback_param.
    shape: envelope
  - name: find-a-class
    path: /davita/v1/find-a-class
    parameters: [location, language, sort, classes, days, time]
    description: >-
      Kidney Smart class finder. Returns a filters[] block (language, sort, class location, days,
      time) with live counts alongside the result set.
    shape: envelope
  - name: usda-search
    path: /davita/v1/usda/search
    parameters: [food, page]
    description: >-
      Food search proxied to USDA FoodData Central, re-shaped for kidney diet: each hit carries
      calories, protein, sodium, potassium and phosphorus.
    upstream: USDA FoodData Central
    shape: envelope
  - name: usda-food
    path: /davita/v1/usda/food/{id}
    parameters: [id]
    description: Single food record by USDA fdcId.
    upstream: USDA FoodData Central
    shape: envelope
envelope:
  description: >-
    davita/v1 routes wrap their payload as {"success": <bool>, "data": <object>}, which is a
    different shape from the wp/v2 collections (bare arrays/objects with _links). An agent must
    handle both.
