api: DaVita Web REST API
conformance:
  - id: rest
    conforms: true
    evidence: >-
      Resource-collection routing, HTTP verb semantics and JSON representations throughout
      /wp-json/wp/v2 and /wp-json/davita/v1.
  - id: hypermedia-links
    conforms: true
    evidence: >-
      Every wp/v2 record carries a _links object (self, collection, about, wp:term, wp:attachment,
      curies) and collections return an RFC 5988 Link header with rel="next"/"prev". Observed on
      GET https://www.davita.com/wp-json/wp/v2/dv-recipe?per_page=2
  - id: pagination
    conforms: true
    evidence: >-
      page/per_page/offset query parameters with X-WP-Total and X-WP-TotalPages response headers,
      exposed to browsers via Access-Control-Expose-Headers. Observed X-WP-Total 1258 on
      /wp-json/wp/v2/dv-recipe
  - id: cors
    conforms: true
    evidence: >-
      Access-Control-Allow-Headers: Authorization, X-WP-Nonce, Content-Disposition, Content-MD5,
      Content-Type; Access-Control-Expose-Headers: X-WP-Total, X-WP-TotalPages, Link
  - id: rfc9457
    conforms: false
    evidence: >-
      Errors are the WordPress WP_Error envelope ({code,message,data.status}) served as
      application/json, not application/problem+json. Observed on
      GET https://www.davita.com/wp-json/davita/v1/nope (404, rest_no_route).
  - id: idempotency
    conforms: false
    evidence: No Idempotency-Key mechanism declared or observed; the public surface is read-only.
  - id: oauth2
    conforms: false
    evidence: >-
      /.well-known/oauth-authorization-server returned 404 on every DaVita host. Write routes use
      WordPress Application Passwords (HTTP basic) and cookie nonces, not OAuth.
  - id: oidc
    conforms: false
    evidence: /.well-known/openid-configuration returned 404 on every DaVita host.
  - id: fhir
    conforms: false
    evidence: >-
      No FHIR capability statement is served on any public DaVita host. api.davita.com/fhir and
      api.davita.com/fhir/metadata both returned HTTP 404 with an empty body on 2026-09-05. DaVita
      is publicly reported to use HL7 FHIR and RESTful APIs internally for clinical data exchange,
      but exposes no public FHIR endpoint.
  - id: scim
    conforms: false
    evidence: No SCIM schema URN or /scim/v2 surface found.
  - id: odata
