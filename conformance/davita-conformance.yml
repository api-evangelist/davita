      marketing, education, recipe and locator content only.
  - id: hl7-fhir
    conforms: false
    kind: domain-standard
    evidence: >-
      The kidney-care sector's clinical interchange standard is HL7 FHIR R4. DaVita's public API
      surface declares no FHIR conformance and serves no CapabilityStatement. Probed
      https://api.davita.com/fhir/metadata -> 404.
    note: >-
      Recorded as an honest negative, not a penalty. Reward-only: an absent domain standard on a
      content API is the expected result.
