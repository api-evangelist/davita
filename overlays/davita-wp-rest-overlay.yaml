  - target: $.paths['/davita/v1/find-a-center'].get
    update:
      summary: Find DaVita dialysis centers near a location
      description: >-
        Dialysis center locator behind https://davita.com/tools/find-a-dialysis-center/. `location`
        is required — supplying only lat/lng returns HTTP 400 rest_missing_callback_param. Responds
        with the davita/v1 envelope {"success": true, "data": {"locations": ...}}.
      x-observed-status: 200
      x-response-envelope: davita-v1
  - target: $.paths['/davita/v1/find-a-class'].get
    update:
      summary: Find DaVita Kidney Smart education classes
      description: >-
        Class finder behind https://davita.com/kidneysmart/. Returns a filters[] block carrying live
        option counts (language, sort, in-person vs online, days, time) alongside the results.
      x-observed-status: 200
      x-response-envelope: davita-v1
  - target: $.paths['/davita/v1/usda/search'].get
    update:
      summary: Search foods for kidney-relevant nutrients
      description: >-
        Food search behind https://davita.com/tools/food-analyzer/. Proxies USDA FoodData Central and
        reshapes each hit to the nutrients that matter on a kidney diet — calories, protein, sodium,
        potassium and phosphorus. Paginated via `page` against totalHits/totalPages in the envelope.
      x-observed-status: 200
      x-upstream: USDA FoodData Central
      x-response-envelope: davita-v1
  - target: $.paths['/davita/v1/usda/food/{id}'].get
    update:
      summary: Get one USDA food record with a kidney-diet nutrient panel
      description: >-
        `id` is a USDA fdcId returned by /davita/v1/usda/search. An unknown id returns HTTP 404 with
        code dv_usda_api_fail_error, not rest_post_invalid_id.
      x-upstream: USDA FoodData Central
      x-response-envelope: davita-v1
  - target: $.paths['/wp/v2/dv-recipe'].get
    update:
      summary: List DaVita kidney-friendly recipes
      description: >-
