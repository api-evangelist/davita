aid: davita
name: DaVita
description: >-
  DaVita Inc. is a Fortune 500 kidney care company operating in-center
  hemodialysis, home hemodialysis, and peritoneal dialysis programs in the
  United States and abroad, alongside transplant support, integrated kidney
  care, hospital partnerships, and clinical research. DaVita does not
  publish a public developer API; integration with the company is handled
  through patient-facing portals, payer and provider partnerships, and
  electronic health record data exchange standards.
