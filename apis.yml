apis:
  - aid: davita-web-rest-api
    name: DaVita Web REST API
    description: >-
      The public, unauthenticated REST API that DaVita's own web platform serves at
      https://www.davita.com/wp-json/. It carries a first-party davita/v1 namespace — a dialysis
      center locator, a Kidney Smart class finder, and a USDA FoodData Central proxy that reshapes
      each food to the nutrients that matter on a kidney diet (sodium, potassium, phosphorus,
      protein, calories) — alongside dv-* content collections holding 1,258 kidney-friendly recipes,
      570 education articles, 126 videos, 51 cookbooks and 33 kidney vocabulary terms. DaVita
      publishes no documentation, no OpenAPI, no SDKs and no developer program for it; the only
      machine-readable definition the company serves is the WordPress REST route discovery index at
      the base URL, from which the OpenAPI in this repository was mechanically derived.
    humanURL: https://davita.com/tools/
    baseURL: https://www.davita.com/wp-json
