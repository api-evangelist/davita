aid: davita
name: DaVita
description: >-
  DaVita Inc. is a Fortune 500 kidney care company operating in-center
  hemodialysis, home hemodialysis, and peritoneal dialysis programs in the
  United States and abroad, alongside transplant support, integrated kidney
  care, hospital partnerships, and clinical research. DaVita runs no developer
  program and publishes no API documentation, but its own web platform serves a
  live, public, unauthenticated REST API at https://www.davita.com/wp-json/ with
  a first-party davita/v1 namespace: a dialysis center locator, a Kidney Smart
  class finder, a USDA-sourced food and nutrient lookup shaped for the kidney
  diet, and 1,258 kidney-friendly recipes, 570 education articles and a kidney
  vocabulary alongside them. Clinical integration remains sales-led through
  payer, hospital and physician partnerships and EHR data exchange; there is no
  public FHIR endpoint.
